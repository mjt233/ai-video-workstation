# ai-video-workstation 容器编排
# 使用：docker compose up -d --build （首次构建耗时较长）
# 访问：http://localhost:3001
#
# 说明：
# - 数据目录（design/、data/、server/config/）以 bind mount 挂载，
#   与宿主机共享，实现「文件系统即数据库」的持久化与直接编辑。
# - providers.json 含各服务商 API 密钥，仅以卷挂载，不会被打进镜像。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 中国大陆 apt 镜像源（清华 TUNA 默认；可换 mirrors.aliyun.com / mirrors.ustc.edu.cn / mirrors.cloud.tencent.com）
        APT_MIRROR: mirrors.tuna.tsinghua.edu.cn
    # 始终基于本地 Dockerfile 构建，避免启动时先尝试 pull 远程同名镜像
    pull_policy: build
    image: ai-video-workstation:latest
    container_name: ai-video-workstation
    ports:
      # 宿主机端口 : 容器内端口（服务端监听 PORT 环境变量）
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      # 项目资产（prompt/assert/overview.md 等，文件系统即数据库）
      - ./app_data/design:/app/design
      # SQLite 数据库（tasks/task_logs，位于 data/workflow.db）
      - ./app_data/data:/app/data
      # 服务商 API 配置（server/config/providers.json，含密钥）
      - ./app_data/server/config:/app/server/config
    restart: unless-stopped
    healthcheck:
      # 轮询项目列表接口，确认服务已就绪
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/projects"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
